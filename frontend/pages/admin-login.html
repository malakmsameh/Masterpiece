<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sahtein Admin Login</title><link rel="stylesheet" href="../css/shared.css"><style>
body{min-height:100vh;display:grid;place-items:center;background:#f4f1eb}.login-card{width:min(440px,calc(100% - 32px));background:#fff;padding:36px;border-radius:18px;box-shadow:0 12px 40px #25201818}.login-card h1{margin:0 0 8px}.login-card p{color:#777}.login-card label{display:block;margin:18px 0 7px}.login-card input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px}.login-card button{width:100%;margin-top:22px}.error{color:#b42318;min-height:1.3em}
</style></head><body><main class="login-card"><a href="../index.html">sahtein<span>.</span></a><h1>Admin sign in</h1><p>Sign in with your administrator account.</p><form id="adminLogin"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p id="loginError" class="error" role="alert"></p><button class="btn btn-primary" type="submit">Sign in</button></form></main><script src="../javascript/admin-api.js"></script><script>
document.getElementById('adminLogin').addEventListener('submit',async function(e){e.preventDefault();const error=document.getElementById('loginError');error.textContent='';try{await AdminApi.login(document.getElementById('email').value.trim(),document.getElementById('password').value);const target=new URLSearchParams(location.search).get('return');location.replace(target&&target.startsWith('admin-')?target:'admin-dashboard.html')}catch(err){error.textContent=Object.values(err.errors||{}).flat().join(' ')||err.message}});
</script></body></html>
